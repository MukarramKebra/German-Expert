<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="LED projector headlight unit">
  <defs>
    <linearGradient id="housing" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#3b424b"/>
      <stop offset="42%" stop-color="#20252c"/>
      <stop offset="100%" stop-color="#12161b"/>
    </linearGradient>
    <linearGradient id="lensCover" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset="38%" stop-color="#cdd8e4" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="drl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#ffe9ea"/>
      <stop offset="100%" stop-color="#ef3b42"/>
    </linearGradient>
    <radialGradient id="proj" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="34%" stop-color="#dce8f5"/>
      <stop offset="68%" stop-color="#7f8d9e"/>
      <stop offset="100%" stop-color="#2a3039"/>
    </radialGradient>
    <radialGradient id="projSm" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#c9d6e4"/>
      <stop offset="100%" stop-color="#262c34"/>
    </radialGradient>
    <radialGradient id="beam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset="55%" stop-color="#ef3b42" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#ef3b42" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shell">
      <path d="M96 206 C96 150 140 112 208 106 L826 136 C988 146 1100 194 1146 238 C1100 284 988 332 826 342 L208 372 C140 378 96 338 96 282 Z"/>
    </clipPath>
  </defs>

  <ellipse cx="560" cy="240" rx="580" ry="230" fill="url(#beam)"/>

  <!-- Housing shell -->
  <path d="M96 206 C96 150 140 112 208 106 L826 136 C988 146 1100 194 1146 238 C1100 284 988 332 826 342 L208 372 C140 378 96 338 96 282 Z" fill="url(#housing)"/>

  <g clip-path="url(#shell)">
    <!-- inner bezel -->
    <path d="M128 208 C128 166 162 140 214 136 L820 164 C962 174 1060 212 1102 240 C1060 268 962 306 820 316 L214 342 C162 346 128 322 128 280 Z" fill="#0d1116"/>

    <!-- main projector -->
    <circle cx="316" cy="246" r="104" fill="#1b2027"/>
    <circle cx="316" cy="246" r="94" fill="url(#proj)"/>
    <circle cx="316" cy="246" r="94" fill="none" stroke="#ffffff" stroke-opacity=".30" stroke-width="3"/>
    <circle cx="316" cy="246" r="76" fill="none" stroke="#2a3039" stroke-opacity=".40" stroke-width="2"/>
    <circle cx="316" cy="246" r="60" fill="none" stroke="#2a3039" stroke-opacity=".34" stroke-width="2"/>
    <circle cx="316" cy="246" r="44" fill="#ffffff" fill-opacity=".58"/>
    <circle cx="316" cy="246" r="44" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="316" cy="246" r="16" fill="#ffffff" fill-opacity=".85"/>
    <ellipse cx="286" cy="214" rx="30" ry="20" fill="#ffffff" fill-opacity=".72" transform="rotate(-28 286 214)"/>

    <!-- secondary projector -->
    <circle cx="536" cy="254" r="78" fill="#1b2027"/>
    <circle cx="536" cy="254" r="69" fill="url(#projSm)"/>
    <circle cx="536" cy="254" r="69" fill="none" stroke="#ffffff" stroke-opacity=".24" stroke-width="3"/>
    <circle cx="536" cy="254" r="54" fill="none" stroke="#2a3039" stroke-opacity=".38" stroke-width="2"/>
    <circle cx="536" cy="254" r="32" fill="#ffffff" fill-opacity=".50"/>
    <circle cx="536" cy="254" r="12" fill="#ffffff" fill-opacity=".8"/>
    <ellipse cx="514" cy="230" rx="22" ry="14" fill="#ffffff" fill-opacity=".66" transform="rotate(-28 514 230)"/>

    <!-- LED cluster -->
    <g fill="#eef4fb">
      <rect x="690" y="214" width="30" height="58" rx="10" opacity=".92"/>
      <rect x="740" y="222" width="30" height="58" rx="10" opacity=".78"/>
      <rect x="790" y="232" width="30" height="56" rx="10" opacity=".62"/>
      <rect x="840" y="242" width="28" height="54" rx="10" opacity=".46"/>
    </g>

    <!-- daytime running light bar -->
    <path d="M168 180 C420 150 760 168 1086 232" fill="none" stroke="url(#drl)" stroke-width="22" stroke-linecap="round" opacity=".95"/>
    <path d="M168 180 C420 150 760 168 1086 232" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".85"/>

    <!-- lower red accent trim -->
    <path d="M196 342 C430 330 720 316 1058 262" fill="none" stroke="#c1121f" stroke-width="9" stroke-linecap="round" opacity=".9"/>

    <!-- glass gloss -->
    <path d="M110 300 L470 92 L660 92 L190 356 Z" fill="#ffffff" fill-opacity=".10"/>
    <path d="M700 92 L760 92 L330 368 L268 368 Z" fill="#ffffff" fill-opacity=".07"/>
    <path d="M96 106 L1146 106 L1146 480 L96 480 Z" fill="url(#lensCover)"/>
  </g>

  <!-- outer rim highlight -->
  <path d="M96 206 C96 150 140 112 208 106 L826 136 C988 146 1100 194 1146 238 C1100 284 988 332 826 342 L208 372 C140 378 96 338 96 282 Z" fill="none" stroke="#9fa9b5" stroke-opacity=".55" stroke-width="4"/>
  <path d="M208 106 L826 136 C988 146 1100 194 1146 238" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="3"/>
</svg>
