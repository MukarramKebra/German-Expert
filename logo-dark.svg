  <title>German Expert</title>
  <!-- emblem: gear-like octagon badge with GE monogram -->
  <g transform="translate(100 100)">
    <polygon points="-41,-99 41,-99 99,-41 99,41 41,99 -41,99 -99,41 -99,-41" fill="#16191f" stroke="#f2b705" stroke-width="8"/>
    <rect x="-70" y="44" width="46" height="12" fill="#0f1115"/>
    <rect x="-23" y="44" width="46" height="12" fill="#c1121f"/>
    <rect x="24" y="44" width="46" height="12" fill="#f2b705"/>
    <text x="0" y="22" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="74" fill="#f2b705" letter-spacing="-2">GE</text>
  </g>
  <text x="222" y="104" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="64" fill="#16191f" letter-spacing="1">GERMAN</text>
