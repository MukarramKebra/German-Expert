<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex" />
  <title>Page Not Found | German Expert</title>
  <link rel="icon" type="image/svg+xml" href="/German-Expert/favicon.svg" />
  <!--
    GitHub Pages serves this file automatically for any unmatched path on
    this project (must live at the repo root, filename exactly 404.html).
    Deliberately self-contained (no dependency on the dynamic code/css or
    code/js loaders in index.html) — an error page shouldn't have its own
    chance to fail to load. Paths are root-relative because a 404 can be
    served at any depth.
  -->
  <style>
    :root { --gold: #f2b705; --red: #c1121f; --ink: #0f1115; --panel: #1a1d23; --muted: #9aa3ae; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--ink); color: #fff;
    }
    header { background: var(--panel); padding: 14px 24px; border-bottom: 3px solid var(--gold); }
    header a { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
    header img { height: 40px; width: auto; border-radius: 50%; }
    main {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 48px 20px;
    }
    .code { font-size: clamp(72px, 18vw, 140px); font-weight: 900; color: var(--gold); line-height: 1; margin: 0; }
    h1 { font-size: clamp(20px, 4vw, 28px); margin: 12px 0 8px; }
    p { color: var(--muted); font-size: 15px; max-width: 440px; margin: 0 0 28px; line-height: 1.6; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 26px; border-radius: 8px; font-weight: 700; font-size: 14px;
      text-decoration: none; transition: opacity .15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn-primary { background: var(--gold); color: var(--ink); }
    .btn-secondary { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.25); }
    footer { padding: 20px; text-align: center; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <a href="/German-Expert/"><img src="/German-Expert/logo.jpg" alt="German Expert" /></a>
  </header>
  <main>
    <p class="code">404</p>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or may have moved. Head back to find the right part for your car.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/German-Expert/">Back to Homepage</a>
      <a class="btn btn-secondary" href="/German-Expert/#categories">Browse Categories</a>
    </div>
  </main>
  <footer>German Expert &mdash; German Car Parts, Sharjah, UAE</footer>
</body>
</html>
